# ============================================
# 蜂群 (Bee Swarm) - 自动部署到 Cloudflare Workers
# ============================================
# Fork 者只需设置 2 个 Secrets：
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
# D1 数据库自动创建

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck || npx tsc --noEmit

      - name: Lint check
        run: npm run lint || echo "No lint script, skipping"

      - name: Build check
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup D1 Database
        id: d1
        run: |
          # 检查 D1 数据库是否存在
          D1_LIST=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/d1/database" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          D1_ID=$(echo $D1_LIST | jq -r '.result[] | select(.name=="bee-swarm-db") | .uuid')
          
          # 如果数据库存在，删除它（解决迁移状态不一致问题）
          if [ ! -z "$D1_ID" ] && [ "$D1_ID" != "null" ]; then
            echo "⚠️ 删除现有的数据库: $D1_ID"
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/d1/database/$D1_ID" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json"
            sleep 5  # 等待数据库删除完成
            D1_ID=""
          fi
          
          # 创建新的 D1 数据库
          echo "✅ 创建新的 D1 数据库..."
          D1_CREATE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/d1/database" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"bee-swarm-db"}')
          D1_ID=$(echo $D1_CREATE | jq -r '.result.uuid')
          echo "✅ D1 数据库已创建: $D1_ID"
          
          echo "d1_id=$D1_ID" >> $GITHUB_OUTPUT

      - name: Setup Queues
        id: queues
        run: |
          echo "检查 Queues 队列是否存在..."
          
          # 尝试列出队列
          set +e  # 临时禁用错误退出
          npx wrangler queues list 2>&1
          set -e  # 重新启用错误退出
          
          # 队列应该已经存在 (bee-swarm-push-queue)
          echo "✅ 期望的队列: bee-swarm-push-queue"
          echo "queues_ready=true" >> $GITHUB_OUTPUT

      - name: Update wrangler.toml with D1 ID
        run: |
          sed -i "s/\${D1_DATABASE_ID}/${{ steps.d1.outputs.d1_id }}/g" wrangler.toml

      - name: Run D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== 运行 D1 数据库迁移 ==="
          npx wrangler d1 migrations apply bee-swarm-db --remote

      - name: Build frontend
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deployment Info
        run: |
          echo "🐝 蜂群部署完成!"
          echo "📍 访问地址: https://bee-swarm.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "🔑 首次访问时注册账号"
