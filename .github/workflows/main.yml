# ============================================
# 蜂群 (Bee Swarm) - 自动部署到 Cloudflare Workers
# ============================================
# Fork 者只需设置 2 个 Secrets：
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
# KV 自动创建

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup KV Namespace
        id: kv
        run: |
          KV_LIST=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          KV_ID=$(echo $KV_LIST | jq -r '.result[] | select(.title=="bee-swarm-kv") | .id')
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            KV_CREATE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"title":"bee-swarm-kv"}')
            KV_ID=$(echo $KV_CREATE | jq -r '.result.id')
          fi
          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT

      - name: Build frontend
        run: npm run build

      - name: Update wrangler.toml with KV ID
        run: |
          sed -i "s/\\\${KV_NAMESPACE_ID}/${{ steps.kv.outputs.kv_id }}/g" wrangler.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deployment Info
        run: |
          echo "🐝 蜂群部署完成!"
          echo "📍 访问地址: https://bee-swarm.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "🔑 首次访问时注册账号"
