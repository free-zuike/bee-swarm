# ============================================
# 蜂群 (Bee Swarm) - 自动部署到 Cloudflare Workers
# ============================================
# Fork 者只需设置 2 个 Secrets：
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
# D1 数据库自动创建

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck || npx tsc --noEmit

      - name: Lint check
        run: npm run lint || echo "No lint script, skipping"

      - name: Build check
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup D1 Database
        id: d1
        run: |
          # 检查 D1 数据库是否存在
          D1_LIST=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/d1/database" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          D1_ID=$(echo $D1_LIST | jq -r '.result[] | select(.name=="bee-swarm-db") | .uuid')
          if [ -z "$D1_ID" ] || [ "$D1_ID" = "null" ]; then
            # 创建 D1 数据库
            D1_CREATE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/d1/database" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"name":"bee-swarm-db"}')
            D1_ID=$(echo $D1_CREATE | jq -r '.result.uuid')
            echo "✅ D1 数据库已创建: $D1_ID"
          else
            echo "✅ D1 数据库已存在: $D1_ID"
          fi
          echo "d1_id=$D1_ID" >> $GITHUB_OUTPUT

      - name: Setup Queues
        id: queues
        run: |
          echo "检查并创建 Queues 队列..."
          
          # 尝试创建队列，忽略错误
          set +e  # 临时禁用错误退出
          
          # 首先尝试列出队列
          npx wrangler queues list 2>/dev/null
          
          # 尝试创建队列
          npx wrangler queues create push-queue 2>&1
          QUEUES_EXIT=$?
          
          set -e  # 重新启用错误退出
          
          if [ $QUEUES_EXIT -eq 0 ]; then
            echo "✅ Queues 队列创建成功: push-queue"
            echo "queues_ready=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  Queues 队列可能已存在或需要先在 Cloudflare 控制台启用 Queues 服务"
            echo "queues_ready=false" >> $GITHUB_OUTPUT
          fi
          
          # 无论队列是否创建成功，部署都会继续进行
          # Queues 功能是可选的，不影响核心功能

      - name: Update wrangler.toml with D1 ID
        run: |
          sed -i "s/\${D1_DATABASE_ID}/${{ steps.d1.outputs.d1_id }}/g" wrangler.toml

      - name: Enable Queues in config if ready
        if: steps.queues.outputs.queues_ready == 'true'
        run: |
          # 取消注释 Queues 配置
          echo "启用 Queues 配置..."
          sed -i '/# \[\[queues.producers\]\]/{n;n;n;n;n;n;n;n;s/# //}' wrangler.toml
          sed -i 's/# \[\[queues.producers\]\]/[[queues.producers]]/' wrangler.toml
          sed -i 's/# queue = "push-queue"/queue = "push-queue"/' wrangler.toml
          sed -i 's/# binding = "PUSH_QUEUE"/binding = "PUSH_QUEUE"/' wrangler.toml
          sed -i 's/# \[\[queues.consumers\]\]/[[queues.consumers]]/' wrangler.toml
          sed -i 's/# max_batch_size = 10/max_batch_size = 10/' wrangler.toml
          sed -i 's/# max_retries = 3/max_retries = 3/' wrangler.toml
          
          echo "✅ Queues 配置已启用"
          
          # 显示更新后的配置
          echo "--- wrangler.toml Queues 配置 ---"
          grep -A 8 -B 2 "queues.producers" wrangler.toml || true

      - name: Run D1 Migrations
        run: |
          echo "运行 D1 数据库迁移..."
          npx wrangler d1 migrations apply bee-swarm-db --remote --database-id=${{ steps.d1.outputs.d1_id }} || echo "迁移可能已存在或需要确认"

      - name: Build frontend
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deployment Info
        run: |
          echo "🐝 蜂群部署完成!"
          echo "📍 访问地址: https://bee-swarm.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "🔑 首次访问时注册账号"
