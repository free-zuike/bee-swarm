# ============================================
# 蜂群 (Bee Swarm) - 自动部署到 Cloudflare Workers
# ============================================
# Fork 者只需设置 2 个 Secrets：
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
# D1 数据库自动创建

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck || npx tsc --noEmit

      - name: Lint check
        run: npm run lint || echo "No lint script, skipping"

      - name: Build check
        run: npm run build

      - name: Unit tests
        run: npm run test

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup D1 Database
        id: d1
        run: |
          # 检查 D1 数据库是否存在
          D1_LIST=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/d1/database" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          D1_ID=$(echo $D1_LIST | jq -r '.result[] | select(.name=="bee-swarm-db") | .uuid')
          if [ -z "$D1_ID" ] || [ "$D1_ID" = "null" ]; then
            # 创建 D1 数据库
            D1_CREATE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/d1/database" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"name":"bee-swarm-db"}')
            D1_ID=$(echo $D1_CREATE | jq -r '.result.uuid')
            echo "✅ D1 数据库已创建: $D1_ID"
          else
            echo "✅ D1 数据库已存在: $D1_ID"
          fi
          echo "d1_id=$D1_ID" >> $GITHUB_OUTPUT

      - name: Setup Queues
        id: queues
        run: |
          echo "检查并创建 Queues 队列..."
          
          # 尝试创建队列（如果已存在会忽略错误）
          set +e
          npx wrangler queues create bee-swarm-push-queue 2>&1
          set -e
          
          echo "✅ 队列 bee-swarm-push-queue 就绪"
          echo "queues_ready=true" >> $GITHUB_OUTPUT

      - name: Update wrangler.toml with D1 ID
        run: |
          # 从 D1 列表中获取数据库 ID
          D1_ID="${{ steps.d1.outputs.d1_id }}"
          if [ -n "$D1_ID" ] && [ "$D1_ID" != "null" ]; then
            sed -i "s/database_id = \".*\"/database_id = \"$D1_ID\"/g" wrangler.toml
            echo "✅ 已更新 wrangler.toml: database_id = $D1_ID"
          else
            echo "⚠️ 未找到 D1 数据库 ID，使用 wrangler.toml 中的默认值"
          fi

      - name: Run D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== 运行 D1 数据库迁移 ==="
          npx wrangler d1 migrations apply bee-swarm-db --remote

      - name: Build frontend
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deployment Info
        run: |
          echo "🐝 蜂群部署完成!"
          echo "📍 访问地址: https://bee-swarm.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "🔑 首次访问时注册账号"
