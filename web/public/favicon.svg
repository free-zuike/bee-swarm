<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- 蜂身 -->
  <ellipse cx="50" cy="55" rx="18" ry="22" fill="#FFD93D"/>
  <ellipse cx="50" cy="55" rx="18" ry="22" fill="none" stroke="#333" stroke-width="2"/>
  <!-- 条纹 -->
  <rect x="32" y="48" width="36" height="4" rx="2" fill="#333"/>
  <rect x="32" y="56" width="36" height="4" rx="2" fill="#333"/>
  <!-- 头 -->
  <circle cx="50" cy="32" r="10" fill="#333"/>
  <!-- 眼睛 -->
  <circle cx="46" cy="30" r="2.5" fill="white"/>
  <circle cx="54" cy="30" r="2.5" fill="white"/>
  <circle cx="46.5" cy="30.5" r="1" fill="#333"/>
  <circle cx="54.5" cy="30.5" r="1" fill="#333"/>
  <!-- 触角 -->
  <line x1="45" y1="24" x2="40" y2="16" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="24" x2="60" y2="16" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <circle cx="40" cy="16" r="2" fill="#333"/>
  <circle cx="60" cy="16" r="2" fill="#333"/>
  <!-- 翅膀 -->
  <ellipse cx="32" cy="45" rx="10" ry="6" fill="rgba(255,255,255,0.7)" transform="rotate(-20 32 45)"/>
  <ellipse cx="68" cy="45" rx="10" ry="6" fill="rgba(255,255,255,0.7)" transform="rotate(20 68 45)"/>
  <!-- 尾针 -->
  <polygon points="50,77 46,85 54,85" fill="#333"/>
</svg>
