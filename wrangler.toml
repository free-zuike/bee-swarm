# ============================================
# 蜂群 (Bee Swarm) - 多渠道推送通知系统
# ============================================
# 敏感配置（密码、密钥）请使用 wrangler secret 命令设置，不要写入此文件！
#
# 设置 Secrets：
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#
# 本地开发时，创建 .dev.vars 文件（已加入 .gitignore）

name = "bee-swarm"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------
# 静态资源（前端构建产物）
# Vite 构建后输出到 dist 目录
# run_worker_first = true 让所有请求先经过 Worker
# ------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

# ------------------------------------------
# KV 命名空间（Web Push 订阅存储）
# ------------------------------------------
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "${KV_NAMESPACE_ID}"

# ------------------------------------------
# 非敏感环境变量（推送渠道配置）
# ------------------------------------------
[vars]
WEWORK_WEBHOOK_URL = ""
DINGTALK_WEBHOOK_URL = ""
DINGTALK_SECRET = ""
FEISHU_WEBHOOK_URL = ""
TELEGRAM_BOT_TOKEN = ""
TELEGRAM_CHAT_ID = ""
BARK_KEY = ""
BARK_SERVER = "https://api.day.app"
NTFY_TOPIC = ""
NTFY_SERVER = "https://ntfy.sh"
RESEND_API_KEY = ""
EMAIL_FROM = ""
EMAIL_TO = ""
