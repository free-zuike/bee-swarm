# ============================================
# 蜂群 (Bee Swarm) - 多渠道推送通知系统
# ============================================
# 敏感配置通过 wrangler secret 设置：
#   npx wrangler secret put ADMIN_PASSWORD
#
# 所有业务数据存储在 D1 数据库中

name = "bee-swarm"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------
# 静态资源（前端构建产物）
# ------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

# ------------------------------------------
# Cron Trigger（定时备份）
# 每 5 分钟触发，代码中判断用户配置的时间是否匹配
# ------------------------------------------
[triggers]
crons = ["*/5 * * * *"]

# ------------------------------------------
# D1 数据库（存储所有业务数据）
# ------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "bee-swarm-db"
database_id = "${D1_DATABASE_ID}"
migrations_dir = "migrations"

# ------------------------------------------
# R2 存储（存储备份文件、附件等）
# ------------------------------------------
# 注意：bucket_name 需要在 wrangler.toml 中设置为有效的值，
# 或者在部署时使用 --var R2_BUCKET_NAME=your-bucket-name 覆盖
# [[r2_buckets]]
# binding = "BACKUP_BUCKET"
# bucket_name = "bee-swarm-backups"

# ------------------------------------------
# Queues 队列（异步任务处理）
# ------------------------------------------
# 注意：需要先在 Cloudflare 控制台创建队列，才能启用此配置
# [[queues.producers]]
# queue = "push-queue"
# binding = "PUSH_QUEUE"

# [[queues.consumers]]
# queue = "push-queue"
# max_batch_size = 10
# max_retries = 3

# ------------------------------------------
# 环境变量配置
# ------------------------------------------
[vars]
# 可选：指定管理员邮箱，该邮箱注册自动成为管理员
# ADMIN_EMAIL = "admin@example.com"

# ------------------------------------------
# Workers 日志和监控
# ------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

