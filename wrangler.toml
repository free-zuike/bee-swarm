# ============================================
# 蜂群 (Bee Swarm) - 多渠道推送通知系统
# ============================================
# 敏感配置通过 wrangler secret 设置：
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put TURNSTILE_SECRET_KEY（可选，用于反爬虫）
#
# 所有业务数据存储在 D1 数据库中

name = "bee-swarm"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------
# 静态资源（前端构建产物）
# ------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

# ------------------------------------------
# Cron Trigger（定时任务）
# ------------------------------------------
# 每 5 分钟触发一次，代码中执行：
# 1. 定时推送检查
# 2. 自动数据清理（清理 30 天前的推送历史和 90 天前的审计日志）
# 3. 备份任务检查
# ------------------------------------------
[triggers]
crons = ["*/5 * * * *"]

# ------------------------------------------
# D1 数据库（存储所有业务数据）
# ------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "bee-swarm-db"
database_id = "${D1_DATABASE_ID}"
migrations_dir = "migrations"

# ------------------------------------------
# R2 存储（存储备份文件、头像等）
# 使用单个存储桶，通过文件夹路径区分不同类型的文件
# ------------------------------------------
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bee-swarm-storage"

# R2 CORS 配置，允许跨域访问头像等静态资源
cors_rules = [
  { allowed_origins = ["*"], allowed_methods = ["GET", "HEAD"], allowed_headers = ["*"], max_age_seconds = 3600 }
]

# ------------------------------------------
# Queues 队列（异步任务处理）
# ------------------------------------------
[[queues.producers]]
queue = "bee-swarm-push-queue"
binding = "PUSH_QUEUE"

[[queues.consumers]]
queue = "bee-swarm-push-queue"
max_batch_size = 10
max_retries = 3

# ------------------------------------------
# 环境变量配置
# ------------------------------------------
[vars]
# 可选：指定管理员邮箱，该邮箱注册自动成为管理员
# ADMIN_EMAIL = "admin@example.com"
# 可选：Turnstile 站点密钥（用于前端显示反爬虫组件）
# TURNSTILE_SITE_KEY = "your-site-key"

# ------------------------------------------
# Workers 日志和监控
# ------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# ------------------------------------------
# Workers AI
# ------------------------------------------
[ai]
binding = "AI"

# ------------------------------------------
# Worker Mailer（邮件发送服务）
# 需要先部署 worker-mailer：https://github.com/nicholasgriffintn/worker-mailer
# 然后在 wrangler.toml 中添加以下配置
# ------------------------------------------
# [services]
# MAILER = { binding = "MAILER", service = "worker-mailer" }

