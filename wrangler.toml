# ============================================
# 蜂群 (Bee Swarm) - 多渠道推送通知系统
# ============================================
# 敏感配置（VAPID 密钥）通过 wrangler secret 设置：
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#
# 管理密码和推送渠道配置在管理后台网页中设置（存储到 KV）
# 本地开发时，创建 .dev.vars 文件（已加入 .gitignore）

name = "bee-swarm"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------
# 静态资源（前端构建产物）
# ------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

# ------------------------------------------
# Cron Trigger（定时备份）
# ------------------------------------------
[triggers]
crons = ["0 */6 * * *", "0 */12 * * *", "0 2 * * *", "0 2 * * 1", "0 2 1 * *"]

# ------------------------------------------
# KV 命名空间（存储订阅和配置）
# ------------------------------------------
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "${KV_NAMESPACE_ID}"
