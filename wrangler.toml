# ============================================
# 蜂群 (Bee Swarm) - 多渠道推送通知系统
# ============================================
# 敏感配置（VAPID 密钥）通过 wrangler secret 设置：
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#
# 管理密码和推送渠道配置在管理后台网页中设置（存储到 KV）
# 本地开发时，创建 .dev.vars 文件（已加入 .gitignore）

name = "bee-swarm"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------
# 静态资源（前端构建产物）
# ------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

# ------------------------------------------
# Cron Trigger（定时备份）
# ------------------------------------------
[triggers]
crons = ["0 2 * * *"]  # 每天凌晨2点（UTC）备份

# ------------------------------------------
# S3 兼容存储环境变量（在 Cloudflare Dashboard 中配置）
# ------------------------------------------
# [vars]
# S3_ENDPOINT - S3 兼容存储的端点 URL
# S3_ACCESS_KEY_ID - Access Key
# S3_SECRET_ACCESS_KEY - Secret Key
# S3_BUCKET - Bucket 名称
# S3_REGION - Region（可选，默认 auto）

# ------------------------------------------
# KV 命名空间（存储订阅和配置）
# ------------------------------------------
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "${KV_NAMESPACE_ID}"
