# ============================================
# 蜂群 (Bee Swarm) - 多渠道推送通知系统
# ============================================
# 敏感配置通过 wrangler secret 设置：
#   npx wrangler secret put ADMIN_PASSWORD
#
# 所有业务数据存储在 D1 数据库中

name = "bee-swarm"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------
# 静态资源（前端构建产物）
# ------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

# ------------------------------------------
# Cron Trigger（定时备份）
# 每 5 分钟触发，代码中判断用户配置的时间是否匹配
# ------------------------------------------
[triggers]
crons = ["*/5 * * * *"]

# ------------------------------------------
# D1 数据库（存储所有业务数据）
# ------------------------------------------
[[d1_databases]]
binding = "DB"
# CI 自动替换为实际 D1 数据库 ID
database_name = "bee-swarm-db"
database_id = "${D1_DATABASE_ID}"

# ------------------------------------------
# Workers 日志和监控
# ------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

