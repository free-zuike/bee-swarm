# ============================================
# 蜂群 (Bee Swarm) - 多渠道推送通知系统
# ============================================
# 敏感配置通过 wrangler secret 设置：
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put TURNSTILE_SECRET_KEY（可选，用于反爬虫）
#
# 所有业务数据存储在 D1 数据库中

name = "bee-swarm"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------
# 静态资源（前端构建产物）
# ------------------------------------------
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = true

# ------------------------------------------
# Cron Trigger（定时任务）
# ------------------------------------------
[triggers]
crons = ["0 * * * *"]

# ------------------------------------------
# D1 数据库（存储所有业务数据）
# ------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "bee-swarm-db"
database_id = "${D1_DATABASE_ID}"
migrations_dir = "migrations"

# ------------------------------------------
# R2 存储（存储备份文件、头像等）
# ------------------------------------------
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bee-swarm-storage"

cors_rules = [
  { allowed_origins = ["*"], allowed_methods = ["GET", "HEAD"], allowed_headers = ["*"], max_age_seconds = 3600 }
]

# ------------------------------------------
# Queues 队列（异步任务处理）
# ------------------------------------------
[[queues.producers]]
queue = "bee-swarm-push-queue"
binding = "PUSH_QUEUE"

[[queues.consumers]]
queue = "bee-swarm-push-queue"
max_batch_size = 10
max_retries = 3

# ------------------------------------------
# KV 命名空间（分布式限流）
# 免费额度：100,000 次读取/天，1,000 次写入/天
# 创建命令：npx wrangler kv:namespace create bee-swarm-rate-limit
# ------------------------------------------
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "${KV_RATE_LIMIT_ID}"

# ------------------------------------------
# Durable Objects（健康检查持久化、WebSocket、分布式锁）
# 免费额度：1 million 请求/月
# ------------------------------------------
[[durable_objects.bindings]]
name = "HEALTH_TRACKER"
class_name = "HealthTrackerDO"

[[durable_objects.bindings]]
name = "WS_MANAGER"
class_name = "WebSocketManagerDO"

[[durable_objects.bindings]]
name = "TASK_LOCK"
class_name = "DistributedLockDO"

[[migrations]]
tag = "v1"
new_classes = ["HealthTrackerDO", "WebSocketManagerDO", "DistributedLockDO"]

# ------------------------------------------
# Vectorize 向量搜索（模板语义搜索）
# 免费额度：30 million 向量维度/月
# 创建命令：npx wrangler vectorize create bee-swarm-templates --dimensions=1024 --metric=cosine
# ------------------------------------------
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "bee-swarm-templates"

# ------------------------------------------
# Workers AI
# ------------------------------------------
[ai]
binding = "AI"

# ------------------------------------------
# 环境变量配置
# ------------------------------------------
[vars]
# ADMIN_EMAIL = "admin@example.com"
# TURNSTILE_SITE_KEY = "your-site-key"

# ------------------------------------------
# Workers 日志和监控
# ------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
